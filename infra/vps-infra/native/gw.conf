# nginx reverse proxy untuk messaging-gateway (VPS-INFRA).
# Dipasang di /etc/nginx/sites-available/gw.conf + symlink sites-enabled.
# SSL dikelola certbot (Let's Encrypt, auto-renew). Blok 443 ditambahkan otomatis oleh certbot.
#
# Deploy:
#   sudo cp gw.conf /etc/nginx/sites-available/gw.conf
#   sudo ln -sf /etc/nginx/sites-available/gw.conf /etc/nginx/sites-enabled/gw.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gw.lumite.biz.id --agree-tos -m info@lumite.biz.id --redirect
#
# Setelah SSL aktif: tutup port 8080 dari publik (akses hanya via HTTPS 443):
#   sudo ufw delete allow 8080/tcp
server {
    listen 80;
    server_name gw.lumite.biz.id;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
