# Mosquitto — VPS-INFRA (shared MQTT untuk portofolio).
# Auth WAJIB, anonymous OFF. Password file di-mount; TLS untuk device dari internet.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS (produksi — isi sertifikat, mis. Let's Encrypt):
listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

# ACL per-app (namespace topik) — lihat 20_MQTT_Integration_Guide.md
# acl_file /mosquitto/config/acl
