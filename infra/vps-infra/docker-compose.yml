# VPS-INFRA — shared WhatsApp Gateway + Mosquitto MQTT untuk portofolio (12 SaaS).
# Jalankan: docker compose up -d   (setelah isi .env dari .env.example masing-masing service)
# Tiap service ber-LIMIT RAM + auto-restart. WA (Chromium) di-isolasi dari yang lain.
services:
  messaging-gateway:
    build: ../../apps/messaging-gateway
    restart: unless-stopped
    env_file: ../../apps/messaging-gateway/.env
    ports:
      - "8080:8080"        # API gateway (taruh di belakang nginx+TLS di produksi)
    volumes:
      - wa_sessions:/data/.wwebjs_auth   # sesi WA persisten (tahan restart)
    deploy:
      resources:
        limits:
          memory: 6g       # batas armada Chromium; naikkan saat sesi WA bertambah
    shm_size: "1gb"        # Chromium butuh /dev/shm cukup
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"        # MQTT plain (batasi via firewall; TLS 8883 di produksi)
      - "8883:8883"        # MQTT TLS (isi sertifikat di ./mosquitto/certs)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  wa_sessions:
  mosquitto_data:
  mosquitto_log:
